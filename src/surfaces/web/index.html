<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Cole · Boots & Hearts 2026</title>
<style>
  :root{ --ink:#eef1f7; --mut:#9aa4b6; --accent:#f4b23e; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2130 0%, rgba(26,33,48,0) 60%),
      radial-gradient(900px 500px at 90% 110%, #241a10 0%, rgba(36,26,16,0) 55%),
      #0b0d12;
    color:var(--ink);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:26px 20px calc(26px + env(safe-area-inset-bottom)); text-align:center;
  }
  .wrap{ max-width:520px; width:100%; }
  .badge{ font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .wordmark{ font-size:64px; font-weight:800; letter-spacing:.16em; text-indent:.16em; margin:16px 0 6px;
    background:linear-gradient(180deg,#ffd884,#f4b23e 55%,#e0742b); -webkit-background-clip:text; background-clip:text;
    color:transparent; }
  .sub{ color:var(--mut); font-size:17px; margin:0 auto 30px; max-width:360px; }
  .foot{ margin-top:34px; color:#5c6472; font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Boots &amp; Hearts · 2026</div>
    <div class="wordmark">COLE</div>
    <p class="sub">Your festival buddy. Tap below and just start talking.</p>

    <elevenlabs-convai
      agent-id="agent_0501kzf5d5d8eaga0kxsmh0ky1hs"
      start-call-text="Talk to Cole"
      action-text="Talk to Cole"
      listening-text="Listening…"
      speaking-text="Cole"
      avatar-orb-color-1="#ffd071"
      avatar-orb-color-2="#e0742b"></elevenlabs-convai>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

    <p class="foot">Have fun. Look out for your crew. 💛</p>
  </div>
</body>
</html>
