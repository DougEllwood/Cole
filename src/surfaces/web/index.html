<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Cole · Boots & Hearts 2026</title>
<style>
  :root{ --ink:#eef1f7; --mut:#9aa4b6; --accent:#f4b23e; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; margin:0; }
  body{
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2130 0%, rgba(26,33,48,0) 60%),
      radial-gradient(900px 500px at 90% 110%, #241a10 0%, rgba(36,26,16,0) 55%),
      #0b0d12;
    color:var(--ink);
    font:16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    min-height:100dvh; padding:26px 20px calc(26px + env(safe-area-inset-bottom)); text-align:center;
  }
  .wrap{ max-width:520px; width:100%; }
  .badge{ font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); font-weight:700; }
  .wordmark{ font-size:64px; font-weight:800; letter-spacing:.16em; text-indent:.16em; margin:16px 0 6px;
    background:linear-gradient(180deg,#ffd884,#f4b23e 55%,#e0742b); -webkit-background-clip:text; background-clip:text;
    color:transparent; }
  .sub{ color:var(--mut); font-size:17px; margin:0 auto 30px; max-width:360px; }
  .foot{ margin-top:34px; color:#5c6472; font-size:12px; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="badge">Boots &amp; Hearts · 2026</div>
    <div class="wordmark">COLE</div>
    <p class="sub">Your festival buddy. Tap below and just start talking.</p>

    <elevenlabs-convai
      agent-id="agent_0501kzf5d5d8eaga0kxsmh0ky1hs"
      start-call-text="Talk to Cole"
      action-text="Talk to Cole"
      listening-text="Listening…"
      speaking-text="Cole"
      avatar-orb-color-1="#ffd071"
      avatar-orb-color-2="#e0742b"></elevenlabs-convai>
    <script src="https://unpkg.com/@elevenlabs/convai-widget-embed" async type="text/javascript"></script>

    <p class="foot">Have fun. Look out for your crew. 💛</p>
  </div>

  <script>
  (function(){
    // Kane's memory — the server fills this in with what Cole should remember.
    var KANE_MEMORY = "__KANE_MEMORY__";

    // A fresh opener every time — dry, festival, the odd dad joke from Cole's old man.
    var GREETINGS = [
      "Yo. My dad's one festival rule: hydrate or die-drate. So… you drinking water or living dangerously?",
      "Alright Kane. Dad joke my old man left me with: I only know 25 letters of the alphabet — I don't know y. Anyway, you still alive out there?",
      "Oh good, you're back. I was starting to think you made real friends. How's it going?",
      "Hey. Running on zero sleep and one questionable corn dog over here. What's the damage at your camp?",
      "Yo. Vibe check — are we 'main character' today, or 'lying in the tent questioning every decision'?",
      "Kane. Why don't skeletons crowd-surf? No guts. …I'll show myself out. How's the day treating you?",
      "Hey. Statistically one of your tent-mates snores like a dying moose. Figured out who yet?",
      "Alright. On a scale of 'fresh' to 'full feral' — where's the crew landing today?",
      "Yo. My dad says never trust a port-a-potty with a shorter line than the bar. How you holding up?",
      "Had a dream you drank a full water yesterday. Wild stuff. How we doing out there?",
      "Hey Kane. Dad told me: I'm reading a book on anti-gravity — impossible to put down. Ok, your turn, how's it going?",
      "Yo. Two questions: did you eat today, and is that a real answer? Talk to me.",
      "Back at it. Warn me now — are we celebrating something or recovering from something?",
      "Hey. My old man says a good weekend is measured in stories, not photos. Give me one — what happened?"
    ];
    function pick(a){ return a[Math.floor(Math.random()*a.length)]; }

    var w = document.querySelector('elevenlabs-convai');
    if (w) {
      w.addEventListener('elevenlabs-convai:call', function(e){
        try{
          e.detail = e.detail || {}; e.detail.config = e.detail.config || {};
          var dv = e.detail.config.dynamicVariables || {};
          dv.kane_memory = KANE_MEMORY || 'nothing yet';
          dv.opening = pick(GREETINGS);
          e.detail.config.dynamicVariables = dv;
        }catch(err){}
      });
    }
  })();
  </script>
</body>
</html>
